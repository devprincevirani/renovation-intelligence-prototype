<!doctype html>
<html lang="en" data-root="../" data-page="forgot-password">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reset your password | Renovation Intelligence</title>
<meta name="description" content="Get a link to set a new password.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#203B38">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Jost:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/css/styles.css">
<script defer src="../assets/js/data.js?v=146"></script>
<script defer src="../assets/js/site.js?v=153"></script>
<script defer src="../assets/js/auth.js"></script>
</head>
<body>
<div id="focus-head" data-exit="login/" data-exit-text="Back to log in"></div>
<main id="main">
<div class="fx-wrap"><div class="fx-card">
  <div id="fp-step1" class="fx-in">
    <div class="fx-top"><span class="fx-kick">Password reset</span><div class="fx-art" data-art="key"></div></div>
    <div class="fx-body">
      <div class="fx-head"><h1>Forgot your password?</h1><p class="muted">No problem. Enter the email you signed up with and we will send you a link to choose a new one.</p></div>
      <form class="form-grid" id="fp-form" novalidate>
        <div class="field"><label for="fp-email">Email</label><input class="input" id="fp-email" type="email" autocomplete="email" placeholder="name@example.com"><span class="err" id="fp-email-err" role="alert"></span></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Send the link <i data-i="arrow" class="i-arrow"></i></button>
      </form>
      <p class="fx-alt">Remembered it? <a href="../login/">Log in</a></p>
    </div>
  </div>
  <div id="fp-step2" class="fx-in" hidden></div>
</div></div>
</main>
</body>
</html>
